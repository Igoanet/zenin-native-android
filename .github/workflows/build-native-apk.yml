name: Build ZENIN Native APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --max-workers=2 --no-daemon
        env:
          GRADLE_OPTS: "-Xmx5g -XX:MaxMetaspaceSize=512m"
          _JAVA_OPTIONS: "-Xmx5g"

      - name: Create Release and upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete native-latest --yes 2>/dev/null || true
          gh release create native-latest \
            --title "ZENIN Native APK (latest)" \
            --notes "Native Kotlin Jetpack Compose build" \
            --prerelease \
            app/build/outputs/apk/debug/app-debug.apk#ZENIN-Native.apk
