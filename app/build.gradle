plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.zenin.app'
    compileSdk 35
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "com.zenin.app"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "2.0"
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("ZENIN_KEYSTORE_PATH")
            if (ksPath != null && new File(ksPath).exists()) {
                storeFile new File(ksPath)
                storePassword System.getenv("ZENIN_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ZENIN_KEY_ALIAS") ?: "zenin"
                keyPassword System.getenv("ZENIN_KEY_PASSWORD") ?: System.getenv("ZENIN_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def ksPath = System.getenv("ZENIN_KEYSTORE_PATH")
            def useRelease = ksPath != null && new File(ksPath).exists()
            signingConfig = useRelease ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.15'
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // Core
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.activity:activity-compose:1.9.3'

    // Compose BOM
    def composeBom = platform('androidx.compose:compose-bom:2024.06.00')
    implementation(composeBom)
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.foundation:foundation'

    // Google Fonts for Compose
    implementation 'androidx.compose.ui:ui-text-google-fonts'

    // Navigation
    implementation 'androidx.navigation:navigation-compose:2.8.4'

    // ViewModel + Lifecycle Compose
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'

    // Networking
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // JSON
    implementation 'com.google.code.gson:gson:2.11.0'

    // Secure Storage
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // DataStore
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Splash Screen
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // Debug
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
